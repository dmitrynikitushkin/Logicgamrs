name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      - name: Restore signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore && echo "$KEYSTORE_B64" | base64 -d > keystore/dumalki.jks
          fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'dumalki' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dumalki-apk
          path: dist/dumalki.apk
